; ==============================================================================
; PlatformIO Project Configuration File for Smart Library ESP32
; ใช้สำหรับเปิดโปรเจกต์ผ่าน Visual Studio Code + PlatformIO IDE
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ความเร็ว Serial Monitor
monitor_speed = 115200

; ไลบรารีที่จำเป็น (PlatformIO จะดาวน์โหลดให้อัตโนมัติเมื่อกด Build)
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.10
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    bblanchon/ArduinoJson @ ^6.21.3

; การตั้งค่าความเร็วในการอัปโหลด
upload_speed = 921600
